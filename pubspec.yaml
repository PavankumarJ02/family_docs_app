name: family_docs_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter

  # Database & storage
  sqflite: ^2.3.0
  path_provider: ^2.1.2
  path: ^1.9.0

  # File handling
  file_selector: ^1.0.3
  open_filex: ^4.4.0

  # App lock
  shared_preferences: ^2.2.2
  local_auth: ^2.2.0

  # State management
  flutter_riverpod: ^2.6.1

  cupertino_icons: ^1.0.8
  uuid: ^4.6.0
  pdfrx: ^2.2.24
  pdf: ^3.12.0
  image: 4.5.4
  camera: ^0.12.0+1
  cunning_document_scanner: ^3.1.0
  google_mlkit_text_recognition: ^0.16.0
  flutter_local_notifications: ^20.1.0
  timezone: ^0.10.1
  flutter_timezone: ^5.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1
  sqflite_common_ffi: ^2.3.7+1

# App icon configuration (TOP LEVEL)
flutter_icons:
  android: true
  ios: true
  image_path: "assets/icon.png"

flutter:
  uses-material-design: true

  assets:
    - assets/icon.png
